<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab — Nexcape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0F172A;
      --purple: #7C3AED;
      --cyan:   #22D3EE;
      --text:   #F1F5F9;
      --muted:  #64748B;
      --glass:  rgba(30,42,69,0.6);
      --border: rgba(34,211,238,0.15);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── Background Canvas ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Background Image overlay ── */
    #bg-image {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #bg-image.loaded { opacity: 0.35; }

    /* ── Main Content ── */
    #newtab {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 32px;
      padding: 20px;
    }

    /* ── Clock ── */
    #clock-wrap {
      text-align: center;
      animation: fadeUp 0.6s ease both;
    }

    #clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(52px, 10vw, 96px);
      font-weight: 300;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      filter: drop-shadow(0 0 30px rgba(34,211,238,0.3));
    }

    #date {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Search Bar ── */
    #search-wrap {
      width: min(600px, 90vw);
      position: relative;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    #search-input {
      width: 100%;
      height: 52px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 0 56px 0 52px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--cyan);
    }

    #search-input:focus {
      border-color: rgba(34,211,238,0.5);
      box-shadow: 0 0 0 4px rgba(34,211,238,0.08), 0 0 40px rgba(34,211,238,0.1);
    }

    #search-input::placeholder { color: var(--muted); }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(124,58,237,0.4);
    }

    #search-btn:hover {
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 4px 20px rgba(34,211,238,0.4);
    }

    /* ── Speed Dial ── */
    #speed-dial {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 700px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .dial-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--glass);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      min-width: 80px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
    }

    .dial-item:hover {
      border-color: var(--border);
      background: rgba(36,51,84,0.8);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 12px rgba(34,211,238,0.08);
    }

    .dial-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255,255,255,0.05);
    }

    .dial-label {
      font-size: 11px;
      color: #94A3B8;
      text-align: center;
      max-width: 70px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Privacy tagline ── */
    #tagline {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    /* ── Bg picker ── */
    #bg-picker {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 20;
      animation: fadeUp 0.6s 0.4s ease both;
    }

    .bg-opt {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .bg-opt:hover, .bg-opt.active {
      border-color: var(--cyan);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(34,211,238,0.4);
    }

    .bg-opt[data-bg="nebula"]  { background: linear-gradient(135deg,#7C3AED,#22D3EE); }
    .bg-opt[data-bg="cosmos"]  { background: linear-gradient(135deg,#0F172A,#1e1b4b); border-color: #4f46e5; }
    .bg-opt[data-bg="aurora"]  { background: linear-gradient(135deg,#064e3b,#22D3EE); }
    .bg-opt[data-bg="midnight"]{ background: linear-gradient(135deg,#1e1b4b,#831843); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="bg-image"></div>

<main id="newtab">

  <!-- Clock -->
  <div id="clock-wrap">
    <div id="clock">00:00</div>
    <div id="date">Thursday, January 1</div>
  </div>

  <!-- Search -->
  <div id="search-wrap">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
      <circle cx="8" cy="8" r="5.5" stroke="#64748B" stroke-width="1.5"/>
      <path d="M13 13l2.5 2.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input id="search-input" type="text" placeholder="Search with Startpage or enter URL..." autocomplete="off" />
    <button id="search-btn" aria-label="Search">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7h10M8 3l4 4-4 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Speed Dial -->
  <div id="speed-dial">
    <a class="dial-item" href="https://www.startpage.com" id="dial-startpage">
      <div class="dial-icon">🔍</div>
      <span class="dial-label">Startpage</span>
    </a>
    <a class="dial-item" href="https://github.com" id="dial-github">
      <div class="dial-icon">💻</div>
      <span class="dial-label">GitHub</span>
    </a>
    <a class="dial-item" href="https://news.ycombinator.com" id="dial-hn">
      <div class="dial-icon">📰</div>
      <span class="dial-label">Hacker News</span>
    </a>
    <a class="dial-item" href="https://proton.me" id="dial-proton">
      <div class="dial-icon">🔒</div>
      <span class="dial-label">Proton</span>
    </a>
    <a class="dial-item" href="https://wikipedia.org" id="dial-wiki">
      <div class="dial-icon">📖</div>
      <span class="dial-label">Wikipedia</span>
    </a>
  </div>

  <!-- Privacy tagline -->
  <p id="tagline">You're exploring the web — not being watched by it</p>

</main>

<!-- Background picker -->
<div id="bg-picker" aria-label="Background theme">
  <button class="bg-opt active" data-bg="nebula" title="Nebula" aria-label="Nebula theme"></button>
  <button class="bg-opt" data-bg="cosmos" title="Cosmos" aria-label="Cosmos theme"></button>
  <button class="bg-opt" data-bg="aurora" title="Aurora" aria-label="Aurora theme"></button>
  <button class="bg-opt" data-bg="midnight" title="Midnight" aria-label="Midnight theme"></button>
</div>

<script>
// ── Clock ──────────────────────────────────────────────────────────────────
const clockEl = document.getElementById('clock');
const dateEl  = document.getElementById('date');

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  clockEl.textContent = `${h}:${m}`;

  const opts = { weekday: 'long', month: 'long', day: 'numeric' };
  dateEl.textContent = now.toLocaleDateString('en-US', opts);
}
updateClock();
setInterval(updateClock, 1000);

// ── Search ─────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('search-input');
const searchBtn   = document.getElementById('search-btn');
const SEARCH_ENGINE = 'https://www.startpage.com/search?q=';
const emit = window.__TAURI__?.event?.emit;

function resolveSearchTarget(query) {
  const looksLikeUrl = /^(https?:\/\/|localhost)/.test(query) || (/^[^\s/]+\.[a-z]{2,}(:\d+)?(\/|$)/i.test(query) && !/\s/.test(query));
  return looksLikeUrl
    ? (query.startsWith('http') ? query : (query.startsWith('localhost') ? `http://${query}` : `https://${query}`))
    : `${SEARCH_ENGINE}${encodeURIComponent(query)}`;
}

async function requestNavigation(target, fallbackUrl) {
  if (emit) {
    try {
      await emit('nexcape:navigate', target);
      return;
    } catch (_) {}
  }

  window.location.href = fallbackUrl || resolveSearchTarget(target);
}

function doSearch() {
  const query = searchInput.value.trim();
  if (!query) return;
  requestNavigation(query, resolveSearchTarget(query));
}

searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
searchBtn.addEventListener('click', doSearch);
searchInput.focus();

// ── Speed Dial links – navigate in same webview ─────────────────────────
document.querySelectorAll('.dial-item').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    requestNavigation(a.href, a.href);
  });
});

// ── Background canvas (nebula particles) ──────────────────────────────────
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let stars = [];

const THEMES = {
  nebula:   { bg: '#0F172A', accent1: '#7C3AED', accent2: '#22D3EE' },
  cosmos:   { bg: '#080B1A', accent1: '#4f46e5', accent2: '#818CF8' },
  aurora:   { bg: '#040D12', accent1: '#065F46', accent2: '#22D3EE' },
  midnight: { bg: '#0a0715', accent1: '#7C3AED', accent2: '#EC4899' },
};

let currentTheme = THEMES.nebula;

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  stars = Array.from({ length: 160 }, () => ({
    x:    Math.random() * canvas.width,
    y:    Math.random() * canvas.height,
    r:    Math.random() * 1.5 + 0.3,
    a:    Math.random(),
    da:   (Math.random() - 0.5) * 0.006,
    vx:   (Math.random() - 0.5) * 0.08,
    vy:   (Math.random() - 0.5) * 0.08,
  }));
}

function drawNebula() {
  // Large blobs
  const blobs = [
    { x: canvas.width * 0.3, y: canvas.height * 0.4, r: canvas.width * 0.35, color: currentTheme.accent1, a: 0.07 },
    { x: canvas.width * 0.7, y: canvas.height * 0.6, r: canvas.width * 0.3,  color: currentTheme.accent2, a: 0.05 },
    { x: canvas.width * 0.1, y: canvas.height * 0.8, r: canvas.width * 0.2,  color: currentTheme.accent1, a: 0.04 },
  ];
  blobs.forEach(b => {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, b.color + Math.round(b.a * 255).toString(16).padStart(2,'0'));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function animate() {
  ctx.fillStyle = currentTheme.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawNebula();

  stars.forEach(s => {
    s.a += s.da;
    if (s.a <= 0 || s.a >= 1) s.da *= -1;
    s.x += s.vx;
    s.y += s.vy;
    if (s.x < 0) s.x = canvas.width;
    if (s.x > canvas.width) s.x = 0;
    if (s.y < 0) s.y = canvas.height;
    if (s.y > canvas.height) s.y = 0;

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a * 0.9})`;
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
animate();

// ── Background theme picker ───────────────────────────────────────────────
document.querySelectorAll('.bg-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bg-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const theme = btn.dataset.bg;
    currentTheme = THEMES[theme] || THEMES.nebula;
    localStorage.setItem('nexcape_bg_theme', theme);
  });
});

// Restore saved theme
const savedTheme = localStorage.getItem('nexcape_bg_theme');
if (savedTheme && THEMES[savedTheme]) {
  currentTheme = THEMES[savedTheme];
  document.querySelectorAll('.bg-opt').forEach(b => {
    b.classList.toggle('active', b.dataset.bg === savedTheme);
  });
}
</script>

</body>
</html>
